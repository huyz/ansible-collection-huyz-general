[project]
name = "huyz.general"
version = "1.1.5"
description = "Ansible collection of roles for general use"
authors = [{ name = "huyz" }]
license = "MIT"
# ansible v13 (EOL in Jun 2026) → ansible-core v2.20 → python 3.12 - 3.14
requires-python = ">=3.12,<4.0"
dependencies = [
    "ansible>=13.0",
    # For use of `manifest` in galaxy.xml
    "distlib>=0.4.0,<0.5.0",
]

[dependency-groups]
dev = [
    "antsibull-changelog>=0.37.0,<0.38.0",
    "pre-commit>=4.7.0,<5.0.0",
    "ansible-lint>=26.0.0,<27.0.0; platform_system != 'Windows'",
    "molecule>=26.0.0,<27.0.0",
    "molecule-plugins[docker]>=26.0.0,<27.0.0",
    "pytest-testinfra>=10.1.1,<11.0.0",
    "pytest-subtests>=0.15.0,<0.16.0",
]

[tool.uv]
package = false
